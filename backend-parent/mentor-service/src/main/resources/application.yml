server:
  port: 8082

spring:
  application:
    name: mentor-service
  datasource:
    url: jdbc:sqlite:${mentor-service.dir:.}/mentor_service.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  flyway:
    enabled: true
    mixed: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
